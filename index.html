    <!-- NAVBAR -->
    <header class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">

    <section class="discounts">

                <i class="fa-solid fa-tag"></i>

            <div class="discounts-slider-container">

    <script src="script.js"></script>

    </section>
